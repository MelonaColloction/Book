<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0c">
<title>کتابخانه‌ی پرونده‌ها</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    background: #0a0a0c;
    color: #d8d8d8;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    line-height: 2.1;
    min-height: 100vh;
  }

  #libraryPage { display: block; }
  #readerPage  { display: none; }

  /* ============ کتابخانه ============ */
  .library-header {
    padding: 40px 22px 25px;
    text-align: center;
    border-bottom: 1px solid #1a1a20;
    background:
      radial-gradient(circle at 50% 0%, rgba(201,168,106,0.08), transparent 70%),
      linear-gradient(180deg, #0d0d10, #0a0a0c);
  }

  .library-header .logo {
    font-size: 0.72rem;
    color: #c9a86a;
    border: 1px solid rgba(201,168,106,0.3);
    border-radius: 999px;
    padding: 4px 14px;
    display: inline-block;
    letter-spacing: 1px;
    margin-bottom: 14px;
  }

  .library-header h1 {
    margin: 0;
    font-size: 1.6rem;
    font-weight: 700;
    color: #f0e6d2;
    letter-spacing: 0.5px;
  }

  .library-header .sub {
    margin-top: 8px;
    font-size: 0.8rem;
    color: #666;
    letter-spacing: 1.5px;
  }

  .stories-list {
    max-width: 720px;
    margin: 0 auto;
    padding: 25px 18px 80px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .story-card {
    display: flex;
    background: #121218;
    border: 1px solid #1e1e26;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .story-card:active {
    transform: scale(0.98);
    border-color: rgba(201,168,106,0.4);
  }

  .story-card .cover {
    width: 110px;
    min-height: 130px;
    flex-shrink: 0;
    background: #1a1a22;
    position: relative;
    overflow: hidden;
  }

  .story-card .cover img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }

  .story-card .cover .ph {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; color: #2e2e38;
    background: repeating-linear-gradient(45deg, #16161c, #16161c 8px, #131318 8px, #131318 16px);
  }

  .story-card .info {
    flex: 1;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }

  .story-card .info .genre {
    font-size: 0.68rem;
    color: #c9a86a;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .story-card .info h3 {
    margin: 0 0 4px;
    font-size: 1.05rem;
    font-weight: 600;
    color: #f0e6d2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .story-card .info .subtitle {
    font-size: 0.78rem;
    color: #777;
    margin-bottom: 8px;
  }

  .story-card .info .progress-line {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.72rem; color: #555;
  }

  .story-card .info .progress-line .dot {
    width: 6px; height: 6px;
    border-radius: 50%; background: #c9a86a;
  }

  .story-card .info .progress-line .dot.empty { background: #333; }

  .story-card .info .progress-line .pct {
    color: #c9a86a; font-weight: 600;
  }

  /* ============ خواننده ============ */
  .reader-topbar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(10,10,12,0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid #1c1c22;
    padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
  }

  .reader-topbar .back-btn {
    background: rgba(201,168,106,0.1);
    border: 1px solid rgba(201,168,106,0.25);
    color: #c9a86a;
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; cursor: pointer;
    flex-shrink: 0; padding: 0;
    font-family: inherit;
  }

  .reader-topbar .back-btn:active { transform: scale(0.92); }

  .reader-topbar .reader-title {
    flex: 1;
    font-size: 0.9rem;
    font-weight: 600;
    color: #c9a86a;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .reader-topbar .mark-btn {
    background: rgba(201,168,106,0.1);
    border: 1px solid rgba(201,168,106,0.25);
    color: #c9a86a;
    border-radius: 999px;
    padding: 8px 14px;
    font-family: inherit; font-size: 0.75rem;
    cursor: pointer; flex-shrink: 0;
    transition: all 0.2s ease;
  }

  .reader-topbar .mark-btn:active { transform: scale(0.95); }
  .reader-topbar .mark-btn.saved {
    background: rgba(201,168,106,0.25);
    color: #f0e6d2;
  }

  .reader-content {
    max-width: 720px;
    margin: 0 auto;
    padding: 30px 22px 140px;
  }

  #readerStory {
    white-space: pre-wrap;
    font-size: 1.05rem;
    font-weight: 300;
    color: #cfcfcf;
    text-align: justify;
    word-spacing: -0.5px;
  }

  .chapter-title {
    display: block;
    color: #c9a86a;
    font-weight: 600;
    font-size: 1.15rem;
    margin-top: 38px;
    margin-bottom: 12px;
    letter-spacing: 0.3px;
  }

  .separator {
    display: block;
    color: #2a2a33;
    font-size: 0.7rem;
    letter-spacing: 3px;
    margin: 28px 0;
    text-align: center;
  }

  /* ============ نوار پیشرفت ============ */
  .progress-track {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 3px; background: #15151a; z-index: 20;
  }

  .progress-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #8a6d3b, #c9a86a);
    transition: width 0.15s linear;
  }

  .reader-controls {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 15;
  }

  .reader-controls button {
    background: rgba(201,168,106,0.1);
    border: 1px solid rgba(201,168,106,0.25);
    color: #c9a86a;
    border-radius: 999px;
    padding: 9px 16px;
    font-family: inherit; font-size: 0.75rem;
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: all 0.2s ease;
  }

  .reader-controls button:active {
    transform: scale(0.95);
    background: rgba(201,168,106,0.2);
  }

  .toast {
    position: fixed; bottom: 80px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(201,168,106,0.95);
    color: #0a0a0c;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: all 0.3s ease;
    z-index: 100;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 480px) {
    .library-header h1 { font-size: 1.35rem; }
    #readerStory { font-size: 1rem; line-height: 2; }
    .story-card .cover { width: 95px; min-height: 120px; }
    .story-card .info { padding: 14px 16px; }
    .story-card .info h3 { font-size: 1rem; }
  }
</style>
</head>
<body>

<!-- ==================== کتابخانه ==================== -->
<div id="libraryPage">
  <div class="library-header">
    <div class="logo">کتابخانه‌ی پرونده‌ها</div>
    <h1>پرونده‌های کارآگاهی</h1>
    <div class="sub">مجموعه داستان‌های جنایی معمایی</div>
  </div>

  <div class="stories-list" id="storiesList"></div>
</div>

<!-- ==================== خواننده ==================== -->
<div id="readerPage">
  <div class="reader-topbar">
    <button class="back-btn" onclick="goBack()">→</button>
    <div class="reader-title" id="readerTitle">—</div>
    <button class="mark-btn" id="markBtn" onclick="saveBookmark()">🔖 نشانه</button>
  </div>
  <div class="reader-content">
    <div id="readerStory"></div>
  </div>
</div>

<div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>

<div class="reader-controls" id="readerControls" style="display:none;">
  <button onclick="scrollTo({top:0, behavior:'smooth'})">↑ بالا</button>
  <button onclick="jumpToBookmark()">🔖 نشانه</button>
  <button onclick="scrollTo({top:document.body.scrollHeight, behavior:'smooth'})">↓ پایین</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   📚 لیست داستان‌ها
   برای اضافه کردن داستان جدید، فقط یه آبجکت اینجا اضافه کن
   ============================================================ */
const STORIES = [
  {
    id: "case63",
    title: "تماس از خودم",
    subtitle: "پرونده‌ی شماره ۶۳",
    genre: "جنایی معمایی",
    cover: "images/case63.png",   // ← عکس توی پوشه‌ی images
    file: "case63.txt"             // ← فایل txt توی ریشه‌ی پروژه
  },
  {
    id: "case64",
    title: "اتاق بی‌پنجره",
    subtitle: "پرونده‌ی شماره ۶۴",
    genre: "جنایی روانشناختی",
    cover: "images/case64.png",
    file: "case64.txt"
  },
  {
    id: "case65",
    title: "مسافر آخر",
    subtitle: "پرونده‌ی شماره ۶۵",
    genre: "جنایی کلاسیک",
    cover: "images/case65.png",
    file: "case65.txt"
  }
];

const STORAGE_PREFIX = 'story_progress_';
let currentStory = null;

/* ============================================================
   نمایش کتابخانه
   ============================================================ */
function renderLibrary() {
  const list = document.getElementById('storiesList');
  list.innerHTML = '';

  STORIES.forEach(story => {
    const progress = getProgress(story.id);

    const card = document.createElement('div');
    card.className = 'story-card';
    card.onclick = () => openStory(story);

    card.innerHTML = `
      <div class="cover">
        <img src="${story.cover}" alt=""
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="ph" style="display:none;">📖</div>
      </div>
      <div class="info">
        <div class="genre">${story.genre || ''}</div>
        <h3>${story.title}</h3>
        <div class="subtitle">${story.subtitle || ''}</div>
        <div class="progress-line">
          <span class="dot ${progress > 0 ? '' : 'empty'}"></span>
          <span>${progress > 0 ? 'در حال خواندن' : 'خوانده نشده'}</span>
          ${progress > 0 ? '<span class="pct">' + progress + '٪</span>' : ''}
        </div>
      </div>
    `;

    list.appendChild(card);
  });
}

/* ============================================================
   باز کردن داستان
   ============================================================ */
async function openStory(story) {
  currentStory = story;

  document.getElementById('libraryPage').style.display = 'none';
  document.getElementById('readerPage').style.display = 'block';
  document.getElementById('readerControls').style.display = 'flex';
  document.getElementById('readerTitle').textContent = story.title;

  const storyEl = document.getElementById('readerStory');
  storyEl.innerHTML = '<div style="text-align:center; color:#666; padding:40px;">در حال بارگذاری...</div>';

  try {
    const res = await fetch(story.file);
    if (!res.ok) throw new Error('فایل ' + story.file + ' پیدا نشد');
    const text = await res.text();

    storyEl.innerHTML = '';
    formatStory(text, storyEl);

    setTimeout(() => {
      const saved = getBookmark(story.id);
      if (saved && saved > 0) {
        window.scrollTo({ top: saved, behavior: 'auto' });
        showToast('از جایی که موندی ادامه بده');
      } else {
        window.scrollTo({ top: 0, behavior: 'auto' });
      }
    }, 150);

  } catch (err) {
    storyEl.innerHTML =
      '<div style="text-align:center; color:#c9a86a; padding:40px;">' +
      'خطا: ' + err.message + '</div>';
  }
}

/* ============================================================
   فرمت متن
   ============================================================ */
function formatStory(text, container) {
  const lines = text.split('\n');
  const frag = document.createDocumentFragment();

  lines.forEach(line => {
    const trimmed = line.trim();
    const span = document.createElement('span');

    if (/^فصل\s/.test(trimmed)) {
      span.className = 'chapter-title';
      span.textContent = trimmed;
    } else if (/^━+$/.test(trimmed)) {
      span.className = 'separator';
      span.textContent = '• • •';
    } else if (/^پایان\.?$/.test(trimmed)) {
      span.className = 'chapter-title';
      span.style.textAlign = 'center';
      span.style.marginTop = '40px';
      span.textContent = 'پایان';
    } else {
      span.textContent = line + '\n';
    }

    frag.appendChild(span);
  });

  container.appendChild(frag);
}

/* ============================================================
   برگشت
   ============================================================ */
function goBack() {
  if (currentStory) saveBookmarkSilent();

  document.getElementById('readerPage').style.display = 'none';
  document.getElementById('libraryPage').style.display = 'block';
  document.getElementById('readerControls').style.display = 'none';
  document.getElementById('progressBar').style.width = '0%';
  window.scrollTo({ top: 0, behavior: 'auto' });

  renderLibrary();
  currentStory = null;
}

/* ============================================================
   نشانه
   ============================================================ */
function saveBookmark() {
  if (!currentStory) return;
  const scrollPos = window.scrollY;
  const total = document.documentElement.scrollHeight - window.innerHeight;
  const percent = total > 0 ? Math.round((scrollPos / total) * 100) : 0;

  localStorage.setItem(STORAGE_PREFIX + currentStory.id, JSON.stringify({
    scroll: scrollPos, percent: percent, date: Date.now()
  }));

  const btn = document.getElementById('markBtn');
  btn.classList.add('saved');
  btn.textContent = '✓ ذخیره شد';
  setTimeout(() => {
    btn.classList.remove('saved');
    btn.textContent = '🔖 نشانه';
  }, 1500);

  showToast('نشانه ذخیره شد — ' + percent + '٪');
}

function saveBookmarkSilent() {
  if (!currentStory) return;
  const scrollPos = window.scrollY;
  const total = document.documentElement.scrollHeight - window.innerHeight;
  const percent = total > 0 ? Math.round((scrollPos / total) * 100) : 0;

  localStorage.setItem(STORAGE_PREFIX + currentStory.id, JSON.stringify({
    scroll: scrollPos, percent: percent, date: Date.now()
  }));
}

function getBookmark(storyId) {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_PREFIX + storyId));
    return data ? data.scroll : 0;
  } catch { return 0; }
}

function getProgress(storyId) {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_PREFIX + storyId));
    return data ? data.percent : 0;
  } catch { return 0; }
}

function jumpToBookmark() {
  if (!currentStory) return;
  const scrollPos = getBookmark(currentStory.id);
  if (scrollPos > 0) {
    window.scrollTo({ top: scrollPos, behavior: 'smooth' });
    showToast('پرش به نشانه');
  } else {
    showToast('هنوز نشانه‌ای ذخیره نکردی');
  }
}

/* ============================================================
   نوار پیشرفت
   ============================================================ */
const bar = document.getElementById('progressBar');
window.addEventListener('scroll', () => {
  if (!currentStory) return;
  const h = document.documentElement;
  const total = h.scrollHeight - h.clientHeight;
  if (total > 0) bar.style.width = (h.scrollTop / total * 100) + '%';
}, { passive: true });

/* ============================================================
   اعلان
   ============================================================ */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ============================================================
   شروع
   ============================================================ */
renderLibrary();
</script>

</body>
  </html>
